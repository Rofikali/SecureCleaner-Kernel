name: Kernel Production Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install QA Tools
        run: pip install black ruff pytest watchdog pydantic pystray pillow plyer
        
      - name: Check Formatting (Black)
        run: black --check .
        
      - name: Lint (Ruff)
        run: ruff check .
        
      - name: Run Unit Tests (Pytest)
        run: pytest tests/

  build-windows-exe:
    needs: quality-assurance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install watchdog pydantic pystray pillow plyer pyinstaller
          
      - name: Compile SecureCleaner EXE
        run: |
          pyinstaller --noconsole --onefile --name "SmartCleaner" --paths . --collect-submodules core --collect-submodules ui --collect-submodules utils --hidden-import=pystray._win32 main.py
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCleaner-Build
          path: dist/SmartCleaner.exe
